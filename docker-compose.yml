
services:
  dev-service-a:
    build: ./microservices/service-a
    container_name: dev-service-a
    ports:
      - 8001:8001
    environment:
      - PORT=8001
      - SERVICE_B_URL=http://dev-service-b:8002
      - JAEGER_AGENT_HOST=dev-jaeger
      - JAEGER_AGENT_PORT=6831
      - FLASK_ENV=development
    networks: [dev]
    depends_on:
      - dev-service-b
      - dev-jaeger
    restart: unless-stopped
    command: python -m flask run --host=0.0.0.0 --port=8001

  dev-service-b:
    build: ./microservices/service-b
    container_name: dev-service-b
    ports:
      - 8002:8002
    environment:
      - PORT=8002
      - JAEGER_AGENT_HOST=dev-jaeger
      - JAEGER_AGENT_PORT=6831
      - FLASK_ENV=development
    networks: [dev]
    depends_on:
      - dev-jaeger
    restart: unless-stopped
    command: python -m flask run --host=0.0.0.0 --port=8002

  dev-jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: dev-jaeger
    ports:
      - 5775:5775/udp
      - 6831:6831/udp
      - 16686:16686
    networks: [dev]
    restart: unless-stopped

  stg-service-a:
    build: ./microservices/service-a
    container_name: stg-service-a
    ports:
      - 9001:8001
    environment:
      - PORT=8001
      - SERVICE_B_URL=http://stg-service-b:8002
      - JAEGER_AGENT_HOST=stg-jaeger
      - JAEGER_AGENT_PORT=6831
      - FLASK_ENV=production
    networks: [stg]
    depends_on:
      - stg-service-b
      - stg-jaeger
    restart: unless-stopped
    command: python -m flask run --host=0.0.0.0 --port=8001

  stg-service-b:
    build: ./microservices/service-b
    container_name: stg-service-b
    ports:
      - 9002:8002
    environment:
      - PORT=8002
      - JAEGER_AGENT_HOST=stg-jaeger
      - JAEGER_AGENT_PORT=6831
      - FLASK_ENV=production
    networks: [stg]
    depends_on:
      - stg-jaeger
    restart: unless-stopped
    command: python -m flask run --host=0.0.0.0 --port=8002

  stg-jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: stg-jaeger
    ports:
      - 5776:5775/udp
      - 6832:6831/udp
      - 16687:16686
    networks: [stg]
    restart: unless-stopped

  prd-service-a:
    build: ./microservices/service-a
    container_name: prd-service-a
    ports:
      - 10001:8001
    environment:
      - PORT=8001
      - SERVICE_B_URL=http://prd-service-b:8002
      - JAEGER_AGENT_HOST=prd-jaeger
      - JAEGER_AGENT_PORT=6831
      - FLASK_ENV=production
    networks: [prd]
    depends_on:
      - prd-service-b
      - prd-jaeger
    restart: unless-stopped
    command: python -m flask run --host=0.0.0.0 --port=8001

  prd-service-b:
    build: ./microservices/service-b
    container_name: prd-service-b
    ports:
      - 10002:8002
    environment:
      - PORT=8002
      - JAEGER_AGENT_HOST=prd-jaeger
      - JAEGER_AGENT_PORT=6831
      - FLASK_ENV=production
    networks: [prd]
    depends_on:
      - prd-jaeger
    restart: unless-stopped
    command: python -m flask run --host=0.0.0.0 --port=8002

  prd-jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: prd-jaeger
    ports:
      - 5777:5775/udp
      - 6833:6831/udp
      - 16688:16686
    networks: [prd]
    restart: unless-stopped

networks:
  dev: { driver: bridge }
  stg: { driver: bridge }
  prd: { driver: bridge }
